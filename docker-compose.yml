version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: pulsevault-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    container_name: pulsevault-backend
    restart: unless-stopped
    depends_on: [mongo]
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - tts_media:/app/media
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: pulsevault
      CORS_ORIGINS: "*"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_LLM_MODEL: llama-3.3-70b-versatile
      GEMINI_MODEL: gemini-2.0-flash
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      TTS_PROVIDER: ${TTS_PROVIDER:-elevenlabs}
      TTS_DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-narrator}
      TTS_CACHE_DIR: ${TTS_CACHE_DIR:-media/tts}
      YT_DLP_COOKIES_FILE: ${YT_DLP_COOKIES_FILE}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      INGEST_MAX_DURATION_SECONDS: ${INGEST_MAX_DURATION_SECONDS:-10800}
      HUNTER_IO_API_KEY: ${HUNTER_IO_API_KEY}
    ports:
      - "8001:8001"

  frontend:
    build: ./frontend
    container_name: pulsevault-frontend
    restart: unless-stopped
    depends_on: [backend]
    volumes:
      - ./frontend/src:/app/src
    environment:
      REACT_APP_BACKEND_URL: http://localhost:8001
    ports:
      - "3000:3000"

  mcp-chrome:
    build: ./mcp-chrome
    container_name: pulsevault-mcp
    restart: unless-stopped
    environment:
      PORT: 8765
    ports:
      - "8765:8765"

volumes:
  mongo_data:
  tts_media:
